<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Digital Clock - Multi Timezone</title>
</head>
<body>
    <div class="container">
        <h1>🕐 Digital Clock</h1>
        
        <div class="clock-grid">
            <div class="time-zone">
                <h2>UTC</h2>
                <div id="utc" class="time">00:00:00</div>
            </div>
            
            <div class="time-zone">
                <h2>New York</h2>
                <div id="newyork" class="time">00:00:00</div>
            </div>
            
            <div class="time-zone">
                <h2>Tokyo</h2>
                <div id="tokyo" class="time">00:00:00</div>
            </div>
            
            <div class="time-zone">
                <h2>London</h2>
                <div id="london" class="time">00:00:00</div>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
